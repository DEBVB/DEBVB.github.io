<meta charset="UTF-8">
<meta name="google-site-verification" content="eQCLmHScF-W6xY6Hhn8cNT3UnUKWG_hgtd1gJ3Ha2zw" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="keywords" content="{{ page.keywords | default: 'Downingtown East, Volleyball, Boys Volleyball, PIAA District 1, Cougars Volleyball, Exton PA' }}">
<meta name="author" content="{{ page.author | default: 'Downingtown East Boys Volleyball' }}">
<meta name="robots" content="{{ page.robots | default: 'index, follow' }}">
<meta name="theme-color" content="#0e1e45">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.og_title | default: page.title }}">
<meta property="og:description" content="{{ page.og_description | default: page.description }}">
<meta property="og:image" content="https://debvb.github.io/social-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Downingtown East Cougar Boys Volleyball team photo">
{% if page.canonical %}<meta property="og:url" content="{{ page.canonical }}">{% endif %}
<meta property="og:site_name" content="Downingtown East Boys Volleyball">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@devbboys">
<meta name="twitter:creator" content="@devbboys">
<meta name="twitter:title" content="{{ page.twitter_title | default: page.og_title | default: page.title }}">
<meta name="twitter:description" content="{{ page.twitter_description | default: page.og_description | default: page.description }}">
<meta name="twitter:image" content="https://debvb.github.io/social-card.jpg">
{% if page.canonical %}<link rel="canonical" href="{{ page.canonical }}">{% endif %}
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
{% if page.preload_json %}<link rel="preload" href="{{ page.preload_json }}" as="fetch">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
{% if page.css %}{% assign page_css = page.css | split: " " %}{% for sheet in page_css %}<link rel="stylesheet" href="/assets/css/{{ sheet }}.css">
{% endfor %}{% endif %}
