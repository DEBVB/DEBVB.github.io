<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Volleyball Score Sheet Training — 2025 NCAA Championship</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Source Sans 3', sans-serif; background: #f4f5f7; min-height: 100vh; }

  /* Header */
  #app-header {
    background: linear-gradient(90deg, #003366 0%, #001a33 100%);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  #app-header .title { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 17px; }
  #app-header .subtitle { color: #FFC72C; font-size: 12px; font-weight: 600; }
  #app-header .phase-count { font-size: 13px; color: #aaa; }
  #app-header .back-link { margin-left: auto; font-size: 12px; font-weight: 600; color: #FFC72C; text-decoration: none; border: 1.5px solid rgba(255,199,44,0.4); padding: 5px 12px; border-radius: 4px; white-space: nowrap; transition: background 0.15s; letter-spacing: 0.05em; text-transform: uppercase; }
  #app-header .back-link:hover { background: rgba(255,199,44,0.12); border-color: #FFC72C; }

  /* Layout */
  #layout { display: flex; max-width: 1100px; margin: 0 auto; padding: 24px 16px; gap: 24px; }

  /* Sidebar */
  #sidebar { min-width: 190px; flex-shrink: 0; }
  #nav { background: #fff; border-radius: 12px; border: 1.5px solid #e0e0e0; overflow: hidden; position: sticky; top: 80px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 14px; background: transparent; color: #333;
    border: none; border-bottom: 1px solid #f0f0f0;
    cursor: pointer; font-size: 13px; font-weight: 500;
    text-align: left; transition: all 0.1s; font-family: 'Source Sans 3', sans-serif;
  }
  .nav-btn:last-child { border-bottom: none; }
  .nav-btn.active { background: #003366; color: #fff; font-weight: 700; }
  .nav-btn .icon { font-size: 16px; }

  /* Content */
  #content { flex: 1; min-width: 0; }
  .phase { display: none; }
  .phase.active { display: block; }

  /* Nav footer buttons */
  #nav-footer { display: flex; justify-content: space-between; margin-top: 32px; padding-top: 20px; border-top: 1.5px solid #e0e0e0; }
  .nav-prev, .nav-next {
    padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: 'Source Sans 3', sans-serif; transition: opacity 0.15s;
  }
  .nav-prev { border: 1.5px solid #ddd; background: #fff; color: #333; }
  .nav-prev:disabled { background: #f5f5f5; color: #aaa; cursor: default; }
  .nav-next { border: none; background: #003366; color: #fff; }
  .nav-next:disabled { background: #ccc; cursor: default; }

  /* Reusable elements */
  h2 { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 6px; }
  .lead { color: #555; margin-bottom: 24px; }
  .card { background: #fff; border: 1.5px solid #ddd; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .card-header { padding: 10px 18px; font-weight: 700; font-size: 14px; color: #fff; }
  .card-body { padding: 16px 18px; }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
  .mono-green { background: #f0fff0; color: #1a7a1a; }
  .mono-red { background: #fff0f0; color: #CC0000; }
  .mono-blue { background: #e0f5ff; color: #006080; }
  .mono-amber { background: #fef3e2; color: #7f5200; }
  .mono-purple { background: #f5e8ff; color: #5a0080; }
  .tip { background: #fffbe6; border: 2px solid #FFC72C; border-radius: 10px; padding: 14px 18px; font-size: 14px; }
  .warn { background: #fff0f0; border: 2px solid #CC0000; border-radius: 10px; padding: 14px 18px; font-size: 14px; }
  .warn ul, .tip ul { margin: 8px 0 0; padding-left: 20px; line-height: 2; color: #444; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .step-circle {
    min-width: 40px; height: 40px; border-radius: 50%;
    background: #003366; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px; font-family: 'Playfair Display', serif; flex-shrink: 0;
  }
  .step-row { display: flex; gap: 18px; margin-bottom: 20px; background: #fff; border: 1.5px solid #e0e0e0; border-radius: 12px; padding: 18px 20px; }

  /* Intro */
  .intro-hero {
    background: linear-gradient(135deg, #003366 0%, #001a33 60%, #000 100%);
    border-radius: 16px; padding: 40px 36px; color: #fff;
    margin-bottom: 28px; position: relative; overflow: hidden;
  }
  .intro-hero::before { content: "🏐"; position: absolute; right: -20px; top: -20px; font-size: 120px; opacity: 0.07; }
  .badge {
    display: inline-block; background: #FFC72C; color: #000;
    font-family: 'Playfair Display', serif; font-weight: 700; font-size: 11px;
    letter-spacing: 3px; padding: 4px 14px; border-radius: 20px; text-transform: uppercase; margin-bottom: 16px;
  }
  .intro-hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(24px,5vw,38px); font-weight: 900; line-height: 1.1; margin-bottom: 10px; }
  .intro-hero .match { color: #FFC72C; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 18px; margin-bottom: 18px; }
  .intro-hero .desc { color: #ccc; font-size: 15px; max-width: 520px; line-height: 1.6; }
  .info-card { background: #fff; border: 2px solid #e0e0e0; border-radius: 12px; padding: 18px 20px; }
  .info-card .emoji { font-size: 28px; margin-bottom: 8px; }
  .info-card .card-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; font-family: 'Playfair Display', serif; }
  .info-card p { color: #555; font-size: 14px; line-height: 1.5; }
  .match-box { background: #fffbe6; border: 2px solid #FFC72C; border-radius: 12px; padding: 18px 22px; margin-bottom: 20px; }
  .match-box .lbl { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .match-box .details { font-size: 14px; line-height: 1.8; color: #333; }
  .btn-start {
    background: #003366; color: #fff; border: none;
    padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 700;
    cursor: pointer; width: 100%; font-family: 'Source Sans 3', sans-serif;
    transition: background 0.15s;
  }
  .btn-start:hover { background: #002244; }

  /* Symbols */
  .symbols-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sym-card {
    border: 2px solid #ddd; border-radius: 10px; padding: 14px 16px;
    cursor: pointer; background: #fff; transition: all 0.15s;
  }
  .sym-card:hover { border-color: #999; }
  .sym-card.open { background: #f8f8ff; }
  .sym-inner { display: flex; align-items: center; gap: 12px; }
  .sym-badge { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 900; min-width: 80px; background: #f5f5f5; padding: 4px 10px; border-radius: 6px; text-align: center; }
  .sym-label { font-weight: 600; font-size: 13px; }
  .sym-desc { margin-top: 10px; font-size: 13px; color: #444; line-height: 1.5; display: none; }
  .sym-card.open .sym-desc { display: block; }
  .ink-tip { margin-top: 20px; background: #f0f4ff; border-radius: 10px; padding: 14px 18px; font-size: 13px; color: #444; line-height: 1.7; }

  /* Lineup table */
  .lineup-table { width: 100%; border-collapse: collapse; }
  .lineup-table th { padding: 8px 12px; text-align: left; font-size: 12px; color: #666; background: #f5f5f5; }
  .lineup-table td { padding: 8px 12px; border-top: 1px solid #eee; font-size: 14px; }
  .lineup-table td.pos { font-weight: 700; font-size: 16px; }
  .lineup-table td.num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; }

  /* Scoring visual table */
  .score-vis { width: 100%; border-collapse: collapse; border: 1.5px solid #ccc; border-radius: 8px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
  .score-vis th { background: #f5f5f5; padding: 8px 12px; font-size: 12px; border-right: 1px solid #ccc; }
  .score-vis td { padding: 8px 12px; border-top: 1px solid #ccc; border-right: 1px solid #ccc; }

  /* Live checklist */
  .checklist-section { margin-bottom: 18px; background: #fff; border: 1.5px solid #ddd; border-radius: 12px; overflow: hidden; }
  .checklist-header { padding: 10px 18px; font-weight: 700; font-size: 14px; color: #fff; }
  .checklist-body { padding: 12px 18px; }
  .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
  .check-row:last-child { border-bottom: none; }
  .checkbox { min-width: 20px; height: 20px; border: 2px solid #ccc; border-radius: 4px; margin-top: 1px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .checkbox.checked { background: #003366; border-color: #003366; color: #fff; font-size: 13px; }
  .check-label { font-size: 14px; color: #333; line-height: 1.5; }

  /* Finish card */
  .finish-card {
    background: linear-gradient(135deg, #003366 0%, #001a33 100%);
    border-radius: 12px; padding: 22px 24px; color: #fff; text-align: center;
  }
  .finish-card h3 { font-family: 'Playfair Display', serif; font-size: 22px; margin: 8px 0; }
  .finish-card p { color: #ccc; font-size: 15px; line-height: 1.6; }

  @media (max-width: 700px) {
    #layout { flex-direction: column; }
    #sidebar { min-width: unset; }
    #nav { position: static; display: flex; flex-wrap: wrap; }
    .nav-btn { width: auto; flex: 1 0 30%; border-bottom: 1px solid #f0f0f0; border-right: 1px solid #f0f0f0; }
    .grid2, .symbols-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="app-header">
  <span style="font-size:24px">🏐</span>
  <div>
    <div class="title">Volleyball Score Sheet Training</div>
    <div class="subtitle">2025 NCAA Championship · LBSU vs. UCLA</div>
  </div>
  <div class="phase-count" id="phase-count" style="margin-left:auto">Phase 1 of 11</div>
  <a href="/index.html" class="back-link">← Back to Site</a>
</div>

<div id="layout">
  <div id="sidebar">
    <div id="nav"></div>
  </div>
  <div id="content">
    <div id="phases-container"></div>
    <div id="nav-footer">
      <button class="nav-prev" id="btn-prev" onclick="navigate(-1)">← Previous</button>
      <button class="nav-next" id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
  </div>
</div>

<script>
const LBSU = "#003366", UCLA = "#2774AE", GOLD = "#FFC72C", RED = "#CC0000";

const phases = [
  { id:"intro", label:"Start Here", icon:"🏐" },
  { id:"symbols", label:"Symbol Key", icon:"🔑" },
  { id:"setup", label:"Before the Game", icon:"📋" },
  { id:"lineups", label:"Lineups", icon:"👥" },
  { id:"points", label:"Scoring Points", icon:"✅" },
  { id:"lossrally", label:"Loss of Rally", icon:"❌" },
  { id:"subs", label:"Substitutions", icon:"🔄" },
  { id:"timeouts", label:"Time-Outs", icon:"⏱️" },
  { id:"libero", label:"Libero Rules", icon:"🔵" },
  { id:"endset", label:"End of Set", icon:"🏆" },
  { id:"liveguide", label:"Live Game Guide", icon:"📺" },
];

let currentIdx = 0;

// --- Build nav ---
const nav = document.getElementById("nav");
phases.forEach((p, i) => {
  const btn = document.createElement("button");
  btn.className = "nav-btn" + (i === 0 ? " active" : "");
  btn.dataset.idx = i;
  btn.innerHTML = `<span class="icon">${p.icon}</span><span>${p.label}</span>`;
  btn.onclick = () => goTo(i);
  nav.appendChild(btn);
});

// --- Phase content builders ---
function buildIntro() {
  return `
    <div style="max-width:720px;margin:0 auto">
      <div class="intro-hero">
        <div class="badge">2025 NCAA Men's Volleyball Championship</div>
        <h1>Score Sheet &<br>Libero Tracker</h1>
        <div class="match">Long Beach State vs. UCLA — May 12, 2025</div>
        <div class="desc">A step-by-step training guide for JV and Varsity players. Follow along while watching the championship match to learn NFHS scoring notation from the real thing.</div>
      </div>
      <div class="grid2" style="margin-bottom:28px">
        ${[
          {e:"📋",t:"What You Need",b:"Blank NFHS score sheet, two pens (blue/black + red), this guide."},
          {e:"🎯",t:"Your Goal",b:"Accurately fill in Set 1 of the championship match from start to finish."},
          {e:"👥",t:"JV Players",b:"Focus on Phases 1–6. Master points, substitutions, and time-outs first."},
          {e:"⭐",t:"Varsity Players",b:"Complete all phases including libero tracking and the full live checklist."},
        ].map(c=>`<div class="info-card"><div class="emoji">${c.e}</div><div class="card-title">${c.t}</div><p>${c.b}</p></div>`).join("")}
      </div>
      <div style="background:#fff;border:2px solid #003366;border-radius:12px;padding:18px 22px;margin-bottom:20px">
        <div style="font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">🖨️</span> Download & Print Before You Watch
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <a href="https://dvboc.net/wp-content/uploads/2016/06/NFHS-Score-Sheets.pdf" target="_blank" rel="noopener"
            style="display:flex;align-items:center;gap:10px;background:#003366;color:#fff;border-radius:8px;padding:12px 16px;text-decoration:none;font-weight:700;font-size:14px;transition:opacity 0.15s"
            onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
            <span style="font-size:22px">📄</span>
            <div><div>NFHS Score Sheet</div><div style="font-weight:400;font-size:11px;color:#FFC72C;margin-top:2px">Click to download PDF → Print</div></div>
          </a>
          <a href="https://www.goldmedalsquared.com/post/volleyball-scoresheet" target="_blank" rel="noopener"
            style="display:flex;align-items:center;gap:10px;background:#1a7a1a;color:#fff;border-radius:8px;padding:12px 16px;text-decoration:none;font-weight:700;font-size:14px;transition:opacity 0.15s"
            onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
            <span style="font-size:22px">📄</span>
            <div><div>Score Sheet + Libero Tracker</div><div style="font-weight:400;font-size:11px;color:#b8ffb8;margin-top:2px">Gold Medal Squared — free download</div></div>
          </a>
        </div>
        <div style="font-size:12px;color:#888;margin-top:10px">
          Print one score sheet per set (3 for JV, 5 for Varsity). Print at least one libero tracker per match.
        </div>
      </div>
        <div class="lbl">🏆 About This Match</div>
        <div class="details">
          <strong>No. 1 Long Beach State Beach</strong> swept <strong>No. 3 UCLA Bruins</strong> to claim their 4th national title.<br>
          <strong>Final Score:</strong> LBSU def. UCLA — 25-17, 25-23, 25-21 (3-0 sweep)<br>
          <strong>MVP:</strong> Moni Nikolov (LBSU) — 27 assists, 6 kills, 4 aces<br>
          <strong>Site:</strong> Covelli Center, Columbus, Ohio
        </div>
      </div>
      <button class="btn-start" onclick="goTo(1)">Start Learning → Symbol Key</button>
    </div>`;
}

const symbols = [
  { sym:"1 2 3 …", label:"Rally Point (Win)", desc:"Write the next point number in the current server's row.", color:"#1a7a1a" },
  { sym:"-|", label:"End of Term (Dash-Bar)", desc:"Serving team lost the rally. Server's turn is over.", color:RED },
  { sym:"[ 4 ]", label:"Loss of Rally Point (Boxed)", desc:"Box the receiving team's first point when they earn serve.", color:RED },
  { sym:"/ 5 /", label:"Running Score Slash", desc:"Slash the matching number in the Running Score column when a point is won.", color:"#1a7a1a" },
  { sym:"S 7/3", label:"Sub (Serving Team)", desc:"S + entering player / leaving player", color:"#7f5200" },
  { sym:"Sx 9/4", label:"Sub (Receiving Team)", desc:"Sx + entering player / leaving player", color:"#7f5200" },
  { sym:"T", label:"Time-Out (Serving)", desc:"Write 'T' in current server's row; note score in Time-Out box.", color:"#5a0080" },
  { sym:"Tx", label:"Time-Out (Receiving)", desc:"Write 'Tx' in current server's row; note score in Time-Out box.", color:"#5a0080" },
  { sym:"△ 8 △", label:"Libero Serve Point (NFHS only)", desc:"NFHS high school only — not used in NCAA men's volleyball. The libero cannot serve in NCAA men's.", color:"#aaa" },
  { sym:"△ -| △", label:"Libero Serve Loss (NFHS only)", desc:"NFHS high school only — not used in NCAA men's volleyball.", color:"#aaa" },
  { sym:"○ 12 ○", label:"Penalty Point", desc:"Circle the point number — awarded for opponent's penalty.", color:RED },
  { sym:"RS", label:"Re-Serve", desc:"First toss that is caught or dropped is a re-serve. No point change.", color:"#444" },
  { sym:"R", label:"Replay", desc:"Referee interrupts the rally. No point awarded.", color:"#444" },
  { sym:"△ on Roman", label:"Libero Replacement (NFHS only)", desc:"NFHS only — triangle around Roman numeral when libero serves. Not used in NCAA men's; libero replacements go on the separate libero tracker sheet.", color:"#aaa" },
];

function buildSymbols() {
  return `
    <div style="max-width:760px">
      <h2>🔑 Scoring Symbol Reference</h2>
      <p class="lead">These are the only symbols you'll ever need. Click any card to see details.</p>
      <div class="symbols-grid" id="sym-grid">
        ${symbols.map((s,i)=>`
          <div class="sym-card" id="sym-${i}" onclick="toggleSym(${i})" style="--sym-color:${s.color}">
            <div class="sym-inner">
              <div class="sym-badge" style="color:${s.color}">${s.sym}</div>
              <div class="sym-label">${s.label}</div>
            </div>
            <div class="sym-desc">${s.desc}</div>
          </div>`).join("")}
      </div>
      <div class="ink-tip"><strong>💡 Ink Tip:</strong> Use <strong>blue or black ink</strong> for the first rotation. Switch to <strong>red ink</strong> when the first server returns for a second turn. Switch back to blue/black for the third rotation.</div>
    </div>`;
}

function toggleSym(i) {
  const el = document.getElementById("sym-" + i);
  const wasOpen = el.classList.contains("open");
  document.querySelectorAll(".sym-card").forEach(c => c.classList.remove("open"));
  if (!wasOpen) el.classList.add("open");
}

const setupSteps = [
  { n:1, title:"Circle the Set Number", detail:"Circle '1' for Set 1. Circle '2' for Set 2, etc.", ex:"Set Number: ①  2  3  4  5", tip:"For JV: best of 3 (circle 1–3). For Varsity: best of 5 (all five)." },
  { n:2, title:"Circle the Level", detail:"Circle 'Varsity' or 'Jr Varsity' to identify which team is scoring.", ex:"Level: Varsity  ⓙ Varsity  Middle School", tip:"You can fill this out on ALL sheets before the match begins." },
  { n:3, title:"Write in the Header", detail:"Date, Home team, Visitor, Site, and Start Time.", ex:"Date: 5/12/25  Home: UCLA  Visitor: LBSU  Site: Covelli Center, Columbus, OH  Start: 7:00 PM ET", tip:"Fill this in on multiple score sheets before the match — saves time later!" },
  { n:4, title:"Write Team Names on Correct Sides", detail:"The team on the LEFT side of the court goes on the LEFT side of the sheet. Teams SWITCH sides between sets — update accordingly!", ex:"Left side: LONG BEACH STATE  |  Right side: UCLA", tip:"If you mix up the sides, you'll award points to the wrong team. Double-check!" },
  { n:5, title:"Mark First Serve with 'X'", detail:"After the coin toss, write an 'X' in the First Serve box for the team serving first.", ex:"LONG BEACH STATE [X] First Serve  |  UCLA [ ] First Serve", tip:"Ask the R2 (floor referee) after warmups who won the toss." },
];

function buildSetup() {
  return `
    <div style="max-width:720px">
      <h2>📋 Before the Game — Setup Steps</h2>
      <p class="lead">Do these steps <strong>before</strong> the first whistle. Arrive 20 minutes early!</p>
      ${setupSteps.map(s=>`
        <div class="step-row">
          <div class="step-circle">${s.n}</div>
          <div>
            <div style="font-weight:700;font-size:16px;margin-bottom:4px">${s.title}</div>
            <div style="color:#333;font-size:14px;margin-bottom:8px;line-height:1.5">${s.detail}</div>
            <div class="mono mono-blue" style="margin-bottom:8px">${s.ex}</div>
            <div style="background:#fffbe6;border-radius:6px;padding:6px 12px;font-size:13px;color:#7a5a00">💡 <strong>Tip:</strong> ${s.tip}</div>
          </div>
        </div>`).join("")}
    </div>`;
}

function buildLineups() {
  const teams = [
    { name:"LBSU", libero:"11", liberoName:"Kellen Larson", color:LBSU, players:[
      {pos:"I",num:"1",name:"Nikolov, Moni"},{pos:"II",num:"12",name:"Kandev, Alex"},
      {pos:"III",num:"18",name:"Dickinson, Nato"},{pos:"IV",num:"5",name:"Preuitt, Isaiah"},
      {pos:"V",num:"4",name:"Varga, Skyler"},{pos:"VI",num:"19",name:"McRaven, DiAeris"},
    ], subs:[
      {num:"10",name:"Bloom, Connor"},{num:"20",name:"Binev, Georgi"},
      {num:"25",name:"Peluso, Ryan"},{num:"28",name:"Connelly, Chris"},
    ]},
    { name:"UCLA", libero:"14", liberoName:"Aziz, Matthew", color:UCLA, players:[
      {pos:"I",num:"7",name:"Rowan, Andrew"},{pos:"II",num:"11",name:"Robinson, Cooper"},
      {pos:"III",num:"21",name:"Rama, Zach"},{pos:"IV",num:"1",name:"Thorne, Cameron"},
      {pos:"V",num:"10",name:"McQuiggan, Sean"},{pos:"VI",num:"16",name:"David, Ido"},
    ], subs:[
      {num:"3",name:"Curci, Luca"},{num:"12",name:"Kelly, Sean"},
      {num:"24",name:"Clini, Kahale"},
    ]},
  ];
  return `
    <div style="max-width:760px">
      <h2>👥 Entering the Lineups</h2>

    { rally:"Rally 2", scenario:"Nikolov serves again — UCLA wins the rally! Score: LBSU 1 – UCLA 1 (side-out)", action:"Draw dash-bar (-|) in Nikolov's row. Box '1' in UCLA's Running Score. In UCLA's Row I (first server), write boxed '1'.", notation:"Row I (LBSU/Nikolov): | 1  -| |    UCLA Running Score: [1]    UCLA Row I: | [1] |", type:"loss" },
    { rally:"Rally 3", scenario:"UCLA serves — LBSU wins the rally! Score: LBSU 2 – UCLA 1", action:"Dash-bar in UCLA Row I. Box '2' in LBSU Running Score. In LBSU's next server row (Kandev, Row II), write boxed '2'.", notation:"UCLA Row I: | [1]  -| |    LBSU Running Score: [2]    LBSU Row II (Kandev): | [2] |", type:"win" },

  return `
    <div style="max-width:720px">

            <tr><td style="padding:6px 10px;border:1px solid #ddd">Libero Serving</td><td style="padding:6px 10px;border:1px solid #ddd;color:#1a7a1a">✅ Allowed</td><td style="padding:6px 10px;border:1px solid #ddd;color:${RED}">❌ Not Allowed</td></tr>
            <tr style="background:#f9f9f9"><td style="padding:6px 10px;border:1px solid #ddd">Subs per set</td><td style="padding:6px 10px;border:1px solid #ddd">18</td><td style="padding:6px 10px;border:1px solid #ddd">15</td></tr>
            <tr><td style="padding:6px 10px;border:1px solid #ddd">Notify R2 at sub #</td><td style="padding:6px 10px;border:1px solid #ddd">15, 16, 17, 18</td><td style="padding:6px 10px;border:1px solid #ddd">12, 13, 14, 15</td></tr>
            <tr style="background:#f9f9f9"><td style="padding:6px 10px;border:1px solid #ddd">Libero replacement recorded on</td><td style="padding:6px 10px;border:1px solid #ddd">Score sheet</td><td style="padding:6px 10px;border:1px solid #ddd">Libero tracker only</td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
}

function buildEndSet() {
  return `
    <div style="max-width:720px">
      <h2>🏆 End of Set Checklist</h2>
      <p class="lead">When the final point is scored, complete these steps quickly.</p>
      <div style="display:grid;gap:12px;margin-bottom:24px">
        ${[
          {n:1,t:"Record the End Time",d:"Write the time in the header field when the last point is awarded."},
          {n:2,t:"Fill in Set Results",d:"Write the Winning Team name and their final point total. Then the Losing Team and their points."},
          {n:3,t:"Wait for R2 to initial the sheet",d:"The floor referee checks your sheet and initials it. Sign your own name if there's a scorer signature field."},
          {n:4,t:"Championship Set Results (Set 1)",d:"Winning Team: Long Beach State — 25 pts. Losing Team: UCLA — 17 pts."},
          {n:5,t:"Switch team sides for Set 2!",d:"Teams switch sides between sets. Move team names to the OPPOSITE side on your Set 2 score sheet."},
        ].map(s=>`
          <div style="display:flex;gap:16px;background:#fff;border:1.5px solid #ddd;border-radius:10px;padding:14px 18px;align-items:flex-start">
            <div class="step-circle">${s.n}</div>
            <div><div style="font-weight:700;font-size:15px">${s.t}</div><div style="font-size:14px;color:#555;margin-top:4px">${s.d}</div></div>
          </div>`).join("")}
      </div>
      <div style="background:#f0fff4;border:2px solid #1a7a1a;border-radius:12px;padding:18px 20px">
        <div style="font-weight:700;font-size:16px;margin-bottom:12px;color:#1a7a1a">🏆 Full Match Results to Record</div>
        <div class="grid3">
          ${[{s:"Set 1",w:"LBSU 25",l:"UCLA 17"},{s:"Set 2",w:"LBSU 25",l:"UCLA 23"},{s:"Set 3",w:"LBSU 25",l:"UCLA 21"}].map(s=>`
            <div style="background:#fff;border-radius:8px;padding:12px;text-align:center;border:1px solid #ddd">
              <div style="font-weight:700;color:${LBSU};margin-bottom:4px">${s.s}</div>
              <div style="font-size:16px;font-weight:900;color:#1a7a1a">${s.w}</div>
              <div style="font-size:13px;color:#888">${s.l}</div>
            </div>`).join("")}
        </div>
      </div>
    </div>`;
}

const liveChecklist = [
  { time:"20 min before", color:LBSU, items:["Fill in headers on all score sheets","Write team names","Get officials' names (R1, R2)","Record coin toss result — mark First Serve X"] },
  { time:"5 min before", color:"#5a0080", items:["Receive lineups from R2","Enter player numbers in Serve Order (I–VI)","Write libero number in Libero box","Verify captain is marked with 'c'"] },
  { time:"When R1 beckons first serve", color:"#1a7a1a", items:["Write Start Time in header","Watch who serves — confirm it matches Row I on your sheet!"] },
  { time:"Every rally", color:"#1a7a1a", items:["Win → write next point number in current server's row + slash Running Score","Loss → dash-bar in server's row + box opponent's point + boxed number in next server's row"] },
  { time:"Each substitution", color:"#7f5200", items:["Write S or Sx + entering/leaving numbers in current server's row","Cross out leaving player in Player Numbers column, write entering player","Slash next Substitution Count number"] },
  { time:"Each time-out", color:"#5a0080", items:["Write T or Tx in current server's row","Note score (requesting team first) in Time-Out box","Tell R2 how many TOs each team has used"] },
  { time:"Libero replacements", color:"#006080", items:["Libero (#11 Larson / #14 Aziz) enters/exits via the replacement zone — NOT the sub zone","This is recorded on the libero tracker, NOT the score sheet","Do NOT count libero replacements toward the substitution total","Libero CANNOT serve in NCAA men's volleyball — flag immediately if they attempt to"] },
  { time:"End of Set", color:"#1a7a1a", items:["Record End Time","Fill in Set Results (Winning Team, Points)","Watch for R2 to initial the sheet"] },
];

let checkStates = {};

function buildLiveGuide() {
  const rows = liveChecklist.map((section, si) =>
    `<div class="checklist-section">
      <div class="checklist-header" style="background:${section.color}">⏰ ${section.time}</div>
      <div class="checklist-body">
        ${section.items.map((item,ii) => {
          const key = `${si}-${ii}`;
          return `<div class="check-row">
            <div class="checkbox${checkStates[key]?' checked':''}" id="chk-${key}" onclick="toggleCheck('${key}')">
              ${checkStates[key]?'✓':''}
            </div>
            <div class="check-label">${item}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`).join("");

  return `
    <div style="max-width:760px">
      <h2>📺 Live Game Master Checklist</h2>
      <p class="lead">Use this as your go-to reference during the match. Check off items as you complete them!</p>
      ${rows}
      <div class="finish-card">
        <div style="font-size:36px">🏐</div>
        <h3>You're Ready!</h3>
        <p>Watch <strong style="color:${GOLD}">Long Beach State vs. UCLA</strong> and fill in every rally, sub, and time-out. Remember: libero replacements go on the tracker sheet, not the score sheet — and the libero cannot serve!<br>Compare your completed sheet with a partner and discuss any differences.</p>
      </div>
    </div>`;
}

function toggleCheck(key) {
  checkStates[key] = !checkStates[key];
  goTo(currentIdx); // re-render current phase
}

const builders = [buildIntro, buildSymbols, buildSetup, buildLineups, buildPoints, buildLossRally, buildSubs, buildTimeouts, buildLibero, buildEndSet, buildLiveGuide];

function goTo(idx) {
  currentIdx = idx;
  // Update nav buttons
  document.querySelectorAll(".nav-btn").forEach((btn, i) => {
    btn.classList.toggle("active", i === idx);
  });
  // Render content
  document.getElementById("phases-container").innerHTML = `<div class="phase active">${builders[idx]()}</div>`;
  // Update phase count
  document.getElementById("phase-count").textContent = `Phase ${idx + 1} of ${phases.length}`;
  // Update prev/next
  document.getElementById("btn-prev").disabled = idx === 0;
  document.getElementById("btn-next").disabled = idx === phases.length - 1;
  // Scroll to top of content
  document.getElementById("content").scrollIntoView({ behavior: "smooth", block: "start" });
}

function navigate(dir) {
  const newIdx = currentIdx + dir;
  if (newIdx >= 0 && newIdx < phases.length) goTo(newIdx);
}

// Init
goTo(0);
</script>
</body>
</html>
