name: Regenerate photos.json

on:
  push:
    paths:
      - 'photos/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate photos.json
        run: |
          python3 - <<'PYEOF'
          import os, json

          IMAGE_EXTS = {'.jpg', '.jpeg', '.png', '.gif', '.webp'}
          photos_dir = 'photos'
          manifest = os.path.join(photos_dir, 'photos.json')
          DEFAULT_ALT = 'Downingtown East Cougars boys volleyball match action'

          # Keep any alt text that was written by hand — only new photos get the default.
          existing = {}
          try:
              with open(manifest) as f:
                  for e in json.load(f):
                      if e.get('src') and e.get('alt'):
                          existing[e['src']] = e['alt']
          except (OSError, ValueError):
              pass

          entries = []
          for fname in sorted(os.listdir(photos_dir), reverse=True):
              ext = os.path.splitext(fname)[1].lower()
              if ext in IMAGE_EXTS:
                  src = f'/photos/{fname}'
                  entries.append({'src': src, 'alt': existing.get(src, DEFAULT_ALT)})

          with open(manifest, 'w') as f:
              json.dump(entries, f, indent=2)
          print(f'Wrote {len(entries)} entries to photos/photos.json')
          PYEOF

      - name: Commit updated manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/photos.json
          git diff --cached --quiet || git commit -m "chore: regenerate photos.json [skip ci]"
          git push
